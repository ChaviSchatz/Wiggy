name: Deploy migrations

# Applies pending supabase/migrations/** to wiggy-production whenever they
# land on main. Closes the gap that caused the 2026-09-10 `is_assignable`
# incident: app code merged and deployed (Vercel) while its migration sat
# unapplied in production, because nothing ran migrations there automatically.
on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

concurrency:
  group: deploy-migrations-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Push migrations to wiggy-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: npm install -g supabase@2.111.0

      - name: Link production project
        run: supabase link --project-ref mzbgpkiiruczufiaietn
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Push pending migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
